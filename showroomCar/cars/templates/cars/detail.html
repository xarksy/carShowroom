<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Mobil</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12 text-center my-4">
                <h1>Detail Mobil</h1>
            </div>
        </div>

        <div class="mb-3">
            <strong>Nama Mobil:</strong> {{ car.nama }}
        </div>
        <div class="mb-3">
            <strong>Harga:</strong> {{ car.harga }}
        </div>
        <div class="mb-3">
            <strong>Tahun:</strong> {{ car.tahun }}
        </div>
        <div class="mb-3">
            <strong>Deskripsi:</strong> {{ car.deskripsi }}
        </div>
        {% comment %} <div class="mb-3">
            <img src="{{ car.image.url }}" alt="{{ car.name }}" style="max-width: 300px; max-height: 300px;">
        </div> {% endcomment %}

        <a href="{% url 'carList' %}" class="btn btn-secondary">Kembali</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" 
            integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" 
            crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" 
            integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" 
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" 
            integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" 
            crossorigin="anonymous"></script>
</body>
</html>
